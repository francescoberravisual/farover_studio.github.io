<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> Far Over Studio – Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ecebe6; --ink:#14161a; --muted:#5d6068; --line:#cfcdc5; --card:#f6f5f1; --accent:#2f4bff; --accent-ink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101216;--ink:#ecebe6;--muted:#9a9da6;--line:#2a2d35;--card:#171a20;--accent:#8da0ff;--accent-ink:#101216;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#101216;--ink:#ecebe6;--muted:#9a9da6;--line:#2a2d35;--card:#171a20;--accent:#8da0ff;--accent-ink:#101216;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:48px 20px 40px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:30px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:clamp(2.4rem,11vw,3.4rem);line-height:.98;letter-spacing:-.03em;margin:22px 0 10px;font-weight:700}
.bio{margin:0 0 32px;color:var(--muted);font-size:1.05rem;max-width:34ch}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--card);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;font-weight:600;font-size:1.05rem;transition:background .15s,border-color .15s}
a.link small{font-weight:400;color:var(--muted);font-size:.88rem}
a.link:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
a.link:hover small{color:inherit}
a.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{margin-top:36px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){a.link{transition:none}}
</style>
</head>
<body>
<main>
  <!-- Per la foto: sostituisci le iniziali con <img src="foto.jpg" alt="Il tuo nome"> -->
  <div class="avatar" aria-hidden="true">TN</div>
  <h1>Il tuo nome</h1>
  <p class="bio">Fotografia, video e post-produzione. Milano.</p>

  <!-- Per aggiungere o togliere un link, copia o cancella un blocco <li> -->
  <ul>
    <li><a class="link" href="https://www.tuosito.it"><span>Portfolio</span><small>tuosito.it</small></a></li>
    <li><a class="link" href="https://www.instagram.com/tuoprofilo"><span>Instagram</span><small>@tuoprofilo</small></a></li>
    <li><a class="link" href="https://vimeo.com/tuoprofilo"><span>Showreel</span><small>Vimeo</small></a></li>
    <li><a class="link" href="https://www.youtube.com/@tuocanale"><span>YouTube</span><small>@tuocanale</small></a></li>
    <li><a class="link" href="https://wa.me/390000000000"><span>Scrivimi su WhatsApp</span></a></li>
    <li><a class="link" href="mailto:ciao@tuosito.it"><span>Email</span><small>ciao@tuosito.it</small></a></li>
  </ul>

  <footer>© Il tuo nome</footer>
</main>
</body>
</html>
